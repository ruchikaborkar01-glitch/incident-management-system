<!doctype html>
<html>
<head>
<title>Incident Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h2>Incident Management</h2>
<div class="row g-2 my-3">
  <div class="col-md-4"><input id="t" class="form-control" placeholder="Title"></div>
  <div class="col-md-4"><input id="d" class="form-control" placeholder="Description"></div>
  <div class="col-md-2">
    <select id="s" class="form-select">
      <option>low</option>
      <option selected>medium</option>
      <option>high</option>
    </select>
  </div>
  <div class="col-md-2"><button class="btn btn-primary w-100" onclick="add()">Create</button></div>
</div>
<table class="table table-bordered">
  <thead>
    <tr><th>ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Assigned</th><th>Action</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<script>
async function load(){
  const r = await (await fetch('/api/incidents')).json();
  document.getElementById('rows').innerHTML = r.map(i => `<tr>
    <td>${i.id}</td><td>${i.title}</td><td>${i.severity}</td><td>${i.status}</td>
    <td>${i.assigned_to || '-'}</td>
    <td>
      <button class="btn btn-sm btn-warning" onclick="assign(${i.id})">Assign</button>
      <button class="btn btn-sm btn-success" onclick="resolve(${i.id})">Resolve</button>
    </td></tr>`).join('');
}
async function add(){
  await fetch('/api/incidents', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title: t.value, description: d.value, severity: s.value})
  });
  t.value = ''; d.value = '';
  load();
}
async function assign(id){
  const n = prompt('Assign to?');
  if(!n) return;
  await fetch('/api/incidents/' + id, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({assigned_to: n, status: 'in-progress'})
  });
  load();
}
async function resolve(id){
  await fetch(`/api/incidents/${id}/resolve`, {method: 'POST'});
  load();
}
load();
</script>
</body>
</html>
